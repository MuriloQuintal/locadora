<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilo.css">

</head>
</head>

<body>
    <main class="tudo">
        <div id="col1">
            <img src="imagens/icone.png" alt="ícone de caminhão">
            <h2 class="titulo">Faça o Login para Gerenciar</h2>
            <p class="texto">Preencha as informações abaixo</p>
            <form id="login" class="login">
                <label for="nome" class="rotulo">Nome</label>
                <input type="text" class="campo-texto" id="nome">
                <label for="email" class="rotulo">E-mail</label>
                <input type="text" class="campo-texto" id="email">
                <button class="botao-login" type="button" id="btn-login">LOGAR</button>
            </form>
        </div>
        <div id="col2">
            <img src="imagens/renault-kwid.png" alt="Renault Kwid">
        </div>
        
    </main>
    
</body>
